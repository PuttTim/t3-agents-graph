<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agents</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 0l1.8 6.2L16 8l-6.2 1.8L8 16l-1.8-6.2L0 8l6.2-1.8z' fill='%233b82f6'/></svg>" />
    <script>
      // Set the theme before first paint so it doesn't fade in from light.
      document.documentElement.dataset.theme =
        localStorage.getItem("agents-theme") ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="bar">
      <div class="title">
        <svg class="spark" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1.5l1.4 4.6 4.6 1.4-4.6 1.4L8 13.5 6.6 8.9 2 7.5l4.6-1.4z" />
          <path d="M13 1l.5 1.5L15 3l-1.5.5L13 5l-.5-1.5L11 3l1.5-.5z" opacity=".7" />
        </svg>
        <span>Agents</span>
        <select id="thread" aria-label="Thread"></select>
      </div>
      <div class="stats">
        <span id="stat-count"></span>
        <span id="stat-running" class="running"></span>
        <span id="stat-cost" class="cost"></span>
        <button id="theme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 100 12A6 6 0 008 2zm0 1.5v9a4.5 4.5 0 010-9z" /></svg>
        </button>
      </div>
    </header>

    <main id="viewport">
      <div id="canvas">
        <svg id="wires"></svg>
      </div>
      <div id="empty" hidden></div>
    </main>

    <aside id="drawer" hidden>
      <button class="icon-btn close" id="drawer-close" aria-label="Close">
        <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" /></svg>
      </button>
      <div id="drawer-body"></div>
    </aside>

    <script type="module" src="/app.js"></script>
  </body>
</html>
